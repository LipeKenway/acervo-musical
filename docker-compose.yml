# docker-compose.yml — Warehouse Postgres + (futuramente) Airflow
# O lake local roda nativo via SeaweedFS (ADR-006, não entra aqui).
# Postgres é o único serviço da FASE 3; outros entram em fases seguintes.

services:
  postgres:
    image: postgres:16-alpine
    container_name: acervo_postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"   # bind em loopback = interfone do apartamento
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
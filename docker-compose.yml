# Caminho preferencial de infra em container (Fase 3+: Postgres).
# O lake local hoje roda via binário nativo do SeaweedFS (ADR-006):
# o MinIO OSS foi arquivado e sua imagem sumiu dos registries.
services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio_lake
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"   # API S3: a porta dos programas
      - "127.0.0.1:9001:9001"   # Console: a porta dos humanos
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 5

volumes:
  minio_data: